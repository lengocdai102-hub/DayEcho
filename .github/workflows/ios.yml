name: iOS + watchOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 不取消正在排队/运行的 run —— macOS runner 排队久，
  # 后续 push 若取消它会导致永远编译不到。
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    # macos-14 已被 GitHub 下线；arm64 标签在免费账户上排队 90+ 分钟。
    # 实测（2026-11-12）：Intel macos-15 / macos-26 秒级可用且 success。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}

    env:
      # 禁用自动签名：unsigned 构建足以验证编译与测试
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # ---- 1. 单元测试（自研 runner，不依赖 XCTest）----
      - name: Run unit tests
        run: swift run DayEchoTestRunner

      # ---- 2. 本地化键一致性检查 ----
      - name: Check localization keys
        run: swift run L10nCheck

      # ---- 2a. 公开 API 跨模块审计 ----
      # 抓「public struct + Codable 但没写 public init()」这类问题：
      # memberwise init 默认 internal，跨模块不可见，外部调用会报
      # "missing argument for parameter 'from'"。
      # SwiftPM 内部测试时完全正常，只有 App 作为框架消费者编译时才炸。
      - name: Audit public API cross-module visibility
        run: swift run ApiAudit

      # ---- 2b. Swift 语法检查（本地就能跑的廉价网）----
      # iOS/watchOS App 的代码不在 SwiftPM target 里，本地编不了。
      # -parse 只做语法分析，能挡住括号不配对之类的低级错误。
      # 类型级检查由下面的 xcodebuild 负责。
      - name: Check Swift syntax
        run: swift run SyntaxCheck

      # ---- 3. 生成 Xcode 工程 ----
      # 工程是脚本生成的（不提交 .xcodeproj），保证配置永远可复现。
      - name: Generate Xcode project
        run: |
          sudo gem install xcodeproj --no-document
          ruby legal/gen_xcodeproj.rb
          ls -la DayEcho.xcodeproj

      # ---- 4. 编译 iOS App（模拟器架构，验证能编过）----
      # 用 -destination 而不是 -sdk：
      # -sdk iphonesimulator 会把所有 target 的 SDKROOT 覆盖成 iphonesimulator，
      # 而 watchapp2 / watchkit2-extension 的 product type spec 只存在于
      # watchsimulator 域 → "unable to resolve product type ... in domain
      # 'iphonesimulator'"。-destination 让 Xcode 按 target 各自解析平台。
      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ---- 4b. 单独 typecheck watchOS Extension ----
      # 先单独查一遍，错误和 iOS 构建的错误分开报，定位更快。
      - name: Typecheck watchOS app
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEchoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataWatchTypecheck" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            -quiet || {
              echo "::error::watchOS App 类型检查未通过（详见上方日志）"; exit 1;
            }

      # ---- 5. 编译 watchOS App（模拟器架构）----
      # 用独立的 watchOS scheme：watchOS 的 API 限制和 iOS 不同，
      # 混在 iOS 构建里出错难定位。
      - name: Build watchOS app (simulator)
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEchoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataWatch" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ---- 6. 真机架构构建（arm64 device）----
      # 模拟器架构装不上真机、也传不上 App Store Connect。
      # 这一路用 -sdk iphoneos 编出 arm64 device 二进制，验证同一套代码
      # 在真机架构下能编译链接通过。unsigned（无证书无描述文件）。
      - name: Build for device (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ---- 6b. 诊断：精准抓嵌入产物的关键判据键值 ----
      #
      # 只打「决定 Xcode 嵌入校验判据」的那几个键，不做全量 dump。
      #
      # 为什么要精准：
      #   find 泛搜会同时命中两处同名产物 ——
      #     A) Build/Products/Release-watchos/DayEchoWatch.app        （未嵌入的裸产物）
      #     B) Build/Products/Release-iphoneos/DayEcho.app/PlugIns/DayEchoWatch.app
      #                                                              （真正触发打包校验的那份）
      #   之前取到的是 A，值自然对不上 —— 所以只看 A 会得出错误结论。
      #   这里用路径模式强制只取 B。
      #
      # 同时输出 commit SHA，把「哪次 run」和「哪份产物」死死绑定。
      - name: Inspect Embedded Watch App Info.plist (Fail-Fast Diagnostics)
        if: failure()
        run: |
          set +e
          echo "=== 1. 当前 Commit ==="
          git rev-parse --short HEAD

          # ★ 现代单 target watchOS 布局：手表 App 在宿主包的 Watch/ 目录。
          #   精准锁定它，避开 Release-watchos 下的裸产物。
          HOST_APP=$(find "$RUNNER_TEMP" ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Release-iphoneos/DayEcho.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$HOST_APP" ]; then
            echo "❌ 未找到 Release-iphoneos/DayEcho.app，打印 Products 目录结构："
            find "$RUNNER_TEMP" ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -path "*/Build/Products/*" 2>/dev/null
            exit 1
          fi

          WATCH_APP="$HOST_APP/Watch/DayEchoWatch.app"
          echo "HOST_APP:       $HOST_APP"
          echo "WATCH_APP:      $WATCH_APP"

          echo
          echo "=== 2. 宿主 iOS App 关键键值 ==="
          echo -n " CFBundleIdentifier = "
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$HOST_APP/Info.plist" 2>&1 || echo "<NOT_SET>"

          echo
          echo "=== 3. 嵌入 Watch App 5 个核心判据键值 ==="
          if [ -d "$WATCH_APP" ]; then
            for KEY in CFBundleIdentifier WKCompanionAppBundleIdentifier WKApplication WKWatchOnly WKRunsIndependentlyOfCompanionApp; do
              VAL=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$WATCH_APP/Info.plist" 2>/dev/null || echo "<NOT_SET>")
              echo " $KEY = $VAL"
            done
            echo
            echo "--- watch app 目录结构 ---"
            find "$WATCH_APP" -maxdepth 2 | sed "s|$WATCH_APP|.|"
            echo
            echo "--- watch 二进制架构 ---"
            lipo -info "$WATCH_APP/DayEchoWatch" 2>&1 || true
          else
            echo "❌ Watch/ 目录下没有 DayEchoWatch.app"
            echo "--- 宿主包实际结构（maxdepth 3）---"
            find "$HOST_APP" -maxdepth 3 | sed "s|$HOST_APP|.|" | head -40
          fi

          echo
          echo "=== 4. xcodebuild 里的真实校验/嵌入命令 ==="
          grep -E 'ValidateEmbeddedBinary|embeddedBinaryValidationUtility|ProcessInfoPlistFile.*watchapp|-producttype com.apple.product-type' /tmp/xcb.log 2>/dev/null | head -10 || echo "(无日志文件，见上方 xcodebuild 输出)"

      # ---- 6c. Pre-Package 断言：打包前 1 秒拦截层级问题 ----
      #
      # 不等 xcodebuild 报晦涩的嵌入校验错误，直接对着 device build 的产物断言。
      - name: Pre-Package Assertion (bundle id hierarchy)
        if: always()
        run: |
          set +e
          HOST_APP="$RUNNER_TEMP/DerivedDataDevice/Build/Products/Release-iphoneos/DayEcho.app"
          WATCH_APP="$HOST_APP/Watch/DayEchoWatch.app"

          if [ ! -d "$WATCH_APP" ]; then
            echo "::error::Pre-Package：找不到 $WATCH_APP"
            echo "--- 宿主包实际结构 ---"
            find "$HOST_APP" -maxdepth 3 | sed "s|$HOST_APP|.|" | head -30
            exit 0
          fi

          HOST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$HOST_APP/Info.plist" 2>/dev/null)
          WATCH_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_APP/Info.plist" 2>/dev/null)
          WK_WATCH_ONLY=$(/usr/libexec/PlistBuddy -c "Print :WKWatchOnly" "$WATCH_APP/Info.plist" 2>/dev/null)
          WK_COMPANION=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$WATCH_APP/Info.plist" 2>/dev/null)
          WK_APPLICATION=$(/usr/libexec/PlistBuddy -c "Print :WKApplication" "$WATCH_APP/Info.plist" 2>/dev/null)

          echo "HOST_BUNDLE_ID      = $HOST_BUNDLE_ID"
          echo "WATCH_BUNDLE_ID     = $WATCH_BUNDLE_ID"
          echo "WK_COMPANION        = ${WK_COMPANION:-<NOT_SET>}"
          echo "WK_APPLICATION      = ${WK_APPLICATION:-<NOT_SET>}"
          echo "WK_WATCH_ONLY       = ${WK_WATCH_ONLY:-<NOT_SET>}"

          FAIL=0

          # 校验规则 1：Watch BundleID 必须严格等于 "${HOST_BUNDLE_ID}.watchkitapp"
          EXPECT_WATCH="${HOST_BUNDLE_ID}.watchkitapp"
          if [ "$WATCH_BUNDLE_ID" != "$EXPECT_WATCH" ]; then
            echo "❌ BundleID 层级校验失败: 期望 $EXPECT_WATCH, 实际 $WATCH_BUNDLE_ID"; FAIL=1
          else
            echo "✅ BundleID 层级正确"
          fi

          # 校验规则 2：WKWatchOnly 绝不能为 true / 1
          if [ "$WK_WATCH_ONLY" = "true" ] || [ "$WK_WATCH_ONLY" = "1" ]; then
            echo "❌ 嵌入模式下禁止声明 WKWatchOnly=true"; FAIL=1
          else
            echo "✅ 未声明 WKWatchOnly"
          fi

          # 校验规则 3：必须反向绑定到宿主 iOS App
          if [ -z "$WK_COMPANION" ] || [ "$WK_COMPANION" != "$HOST_BUNDLE_ID" ]; then
            echo "❌ WKCompanionAppBundleIdentifier 应等于宿主 $HOST_BUNDLE_ID, 实际 ${WK_COMPANION:-<NOT_SET>}"; FAIL=1
          else
            echo "✅ WKCompanionAppBundleIdentifier 正确"
          fi

          # 校验规则 4：现代 SwiftUI watch App 必须有 WKApplication
          if [ "$WK_APPLICATION" != "YES" ] && [ "$WK_APPLICATION" != "true" ] && [ "$WK_APPLICATION" != "1" ]; then
            echo "❌ 缺少 WKApplication=YES（现代 SwiftUI watch App 必需标记）"; FAIL=1
          else
            echo "✅ WKApplication 存在"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "::error::Pre-Package 断言失败"
          fi
          exit 0

      # ---- 7. 真机归档 + 打出 unsigned .ipa ----
      - name: Archive for device and package unsigned .ipa
        run: |
          set -e
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            -archivePath "$RUNNER_TEMP/DayEcho-device.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

          APP="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app"
          if [ ! -d "$APP" ]; then
            echo "::error::device archive 里没找到 DayEcho.app"; exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipapkg"
          mkdir -p "$RUNNER_TEMP/ipapkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipapkg/Payload/"
          cd "$RUNNER_TEMP/ipapkg"
          zip -qry "$RUNNER_TEMP/DayEcho-unsigned.ipa" Payload
          echo "--- .ipa 产出 ---"
          ls -la "$RUNNER_TEMP/DayEcho-unsigned.ipa"

      # ---- 8. 验证真机二进制架构 ----
      - name: Verify device binary is arm64
        run: |
          set -e
          BIN="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app/DayEcho"
          if [ ! -f "$BIN" ]; then
            echo "::error::找不到 device 二进制"; exit 1
          fi
          echo "--- lipo 架构 ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'arm64' || { echo "::error::不是 arm64"; exit 1; }
          if lipo -info "$BIN" | grep -qiE 'x86_64|i386-simulator'; then
            echo "::error::device 二进制混入了模拟器架构"; exit 1
          fi
          echo "✅ 真机 arm64 二进制确认"

      # ---- 9. 验证 watchOS App 已嵌入 iOS 包 ----
      # 这是最容易悄悄坏掉的地方：watch target 编过了，但没被
      # "Embed Watch Content" 阶段塞进 .app，装到手机上会没有手表 App。
      #
      # watchOS 的包结构是两层：
      #   DayEcho.app/PlugIns/DayEchoWatch.app          <- watch2_app 壳
      #   DayEcho.app/PlugIns/DayEchoWatch.app/PlugIns/DayEchoWatchExtension.appex  <- 业务代码
      # 只验到壳这一层不够 —— 扩展缺失的话手表上点开就白屏。
      - name: Verify watchOS app is embedded
        run: |
          set -e
          APP="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app"

          # ★ 现代单 target watchOS 布局：手表 App 在宿主包的 Watch/ 目录，
          #   没有 PlugIns/*.appex，也没有 WatchKit 嵌入校验。
          FOUND=$(find "$APP/Watch" -maxdepth 2 -name "DayEchoWatch.app" 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::iOS 包里没找到嵌入的 DayEchoWatch.app（Watch/ 目录不存在）"
            echo "--- 实际结构 ---"
            find "$APP" -maxdepth 3 | sed "s|$APP|.|" | head -40
            exit 1
          fi
          echo "--- 嵌入的 watch App: $FOUND ---"

          WBIN="$FOUND/DayEchoWatch"
          if [ ! -f "$WBIN" ]; then
            echo "::error::watch App 里没有可执行文件"; exit 1
          fi
          lipo -info "$WBIN"
          lipo -info "$WBIN" | grep -q 'arm64' || { echo "::error::watch 二进制不是 arm64"; exit 1; }

          # 依附式手表 App 的关键判据
          WAC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$FOUND/Info.plist" 2>/dev/null || echo "")
          WCOMP=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$FOUND/Info.plist" 2>/dev/null || echo "")
          WAPP=$(/usr/libexec/PlistBuddy -c "Print :WKApplication" "$FOUND/Info.plist" 2>/dev/null || echo "")
          WWO=$(/usr/libexec/PlistBuddy -c "Print :WKWatchOnly" "$FOUND/Info.plist" 2>/dev/null || echo "")
          HOSTID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null || echo "")

          echo "host CFBundleIdentifier               = $HOSTID"
          echo "watch CFBundleIdentifier              = $WAC"
          echo "watch WKCompanionAppBundleIdentifier  = $WCOMP"
          echo "watch WKApplication                   = ${WAPP:-<NOT_SET>}"
          echo "watch WKWatchOnly                     = ${WWO:-<NOT_SET>}"

          # WKApplication 必须存在（现代 SwiftUI watch App 标记）
          if [ "$WAPP" != "YES" ] && [ "$WAPP" != "true" ] && [ "$WAPP" != "1" ]; then
            echo "::error::watch App 缺少 WKApplication=YES（现代 SwiftUI watch App 必需标记）"; exit 1
          fi

          # WKCompanionAppBundleIdentifier 必须等于宿主
          if [ -z "$WCOMP" ] || [ "$WCOMP" != "$HOSTID" ]; then
            echo "::error::WKCompanionAppBundleIdentifier 应等于宿主 $HOSTID, 实际 ${WCOMP:-<NOT_SET>}"; exit 1
          fi

          # 不能声明 WKWatchOnly=true
          if [ "$WWO" = "true" ] || [ "$WWO" = "1" ]; then
            echo "::error::watch app 声明了 WKWatchOnly=true，与嵌入 iOS App 冲突"; exit 1
          fi

          # bundle id 层级
          EXPECT_WATCH="${HOSTID}.watchkitapp"
          if [ "$WAC" != "$EXPECT_WATCH" ]; then
            echo "::error::watch bundle id 应为 $EXPECT_WATCH, 实际 $WAC"; exit 1
          fi

          echo "✅ watchOS App 已正确嵌入宿主包且判据全部正确"

      # ---- 10. 收集产物 ----
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          for d in "$RUNNER_TEMP/DayEcho-device.xcarchive" "$RUNNER_TEMP/DerivedData/Build/Products" "$RUNNER_TEMP/DerivedDataWatch/Build/Products"; do
            [ -d "$d" ] && cp -R "$d" artifacts/ 2>/dev/null || true
          done
          [ -f "$RUNNER_TEMP/DayEcho-unsigned.ipa" ] && cp "$RUNNER_TEMP/DayEcho-unsigned.ipa" artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DayEcho-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
