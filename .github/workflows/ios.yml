name: iOS + watchOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 不取消正在排队/运行的 run —— macOS runner 排队久，
  # 后续 push 若取消它会导致永远编译不到。
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    # macos-14 已被 GitHub 下线；arm64 标签在免费账户上排队 90+ 分钟。
    # 实测（2026-11-12）：Intel macos-15 / macos-26 秒级可用且 success。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}

    env:
      # 禁用自动签名：unsigned 构建足以验证编译与测试
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # ---- 1. 单元测试（自研 runner，不依赖 XCTest）----
      - name: Run unit tests
        run: swift run DayEchoTestRunner

      # ---- 2. 本地化键一致性检查 ----
      - name: Check localization keys
        run: swift run L10nCheck

      # ---- 2a. 公开 API 跨模块审计 ----
      # 抓「public struct + Codable 但没写 public init()」这类问题：
      # memberwise init 默认 internal，跨模块不可见，外部调用会报
      # "missing argument for parameter 'from'"。
      # SwiftPM 内部测试时完全正常，只有 App 作为框架消费者编译时才炸。
      - name: Audit public API cross-module visibility
        run: swift run ApiAudit

      # ---- 2b. Swift 语法检查（本地就能跑的廉价网）----
      # iOS/watchOS App 的代码不在 SwiftPM target 里，本地编不了。
      # -parse 只做语法分析，能挡住括号不配对之类的低级错误。
      # 类型级检查由下面的 xcodebuild 负责。
      - name: Check Swift syntax
        run: swift run SyntaxCheck

      # ---- 3. 生成 Xcode 工程 ----
      # 工程是脚本生成的（不提交 .xcodeproj），保证配置永远可复现。
      - name: Generate Xcode project
        run: |
          sudo gem install xcodeproj --no-document
          ruby legal/gen_xcodeproj.rb
          ls -la DayEcho.xcodeproj

      # ---- 4. 编译 iOS App（模拟器架构，验证能编过）----
      # 用 -destination 而不是 -sdk：
      # -sdk iphonesimulator 会把所有 target 的 SDKROOT 覆盖成 iphonesimulator，
      # 而 watchapp2 / watchkit2-extension 的 product type spec 只存在于
      # watchsimulator 域 → "unable to resolve product type ... in domain
      # 'iphonesimulator'"。-destination 让 Xcode 按 target 各自解析平台。
      - name: Build iOS app (simulator)
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ---- 4b. 单独 typecheck watchOS Extension ----
      # 先单独查一遍，错误和 iOS 构建的错误分开报，定位更快。
      - name: Typecheck watchOS extension
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEchoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataWatchTypecheck" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            -quiet || {
              echo "::error::watchOS Extension 类型检查未通过（详见上方日志）"; exit 1;
            }

      # ---- 5. 编译 watchOS App（模拟器架构）----
      # 用独立的 watchOS scheme：watchOS 的 API 限制和 iOS 不同，
      # 混在 iOS 构建里出错难定位。
      - name: Build watchOS app (simulator)
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEchoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataWatch" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ---- 6. 真机架构构建（arm64 device）----
      # 模拟器架构装不上真机、也传不上 App Store Connect。
      # 这一路用 -sdk iphoneos 编出 arm64 device 二进制，验证同一套代码
      # 在真机架构下能编译链接通过。unsigned（无证书无描述文件）。
      - name: Build for device (arm64, unsigned)
        run: |
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ---- 6b. 诊断：dump watch 产物结构 ----
      # 失败时最需要知道的事实：.appex 到底在不在、被放到了哪。
      - name: Dump watch bundle structure
        if: always()
        run: |
          set +e
          APP="$RUNNER_TEMP/DerivedDataDevice/Build/Products/Release-iphoneos/DayEcho.app"
          echo "===== DayEcho.app 结构 ====="
          find "$APP" -maxdepth 4 | sed "s|$APP|.|" | head -60
          echo
          echo "===== PlugIns 下的 watch app ====="
          WATCH="$APP/PlugIns/DayEchoWatch.app"
          if [ -d "$WATCH" ]; then
            find "$WATCH" -maxdepth 3 | sed "s|$WATCH|.|" | head -40
            echo "--- watch app 自己的 PlugIns ---"
            ls -la "$WATCH/PlugIns" 2>&1
          else
            echo "没有 $WATCH"
            echo "--- PlugIns 实际内容 ---"
            ls -la "$APP/PlugIns" 2>&1
          fi
          echo
          echo "===== Release-iphoneos 全部产物 ====="
          find "$RUNNER_TEMP/DerivedDataDevice/Build/Products" -maxdepth 3 -name "*.appex" -o -maxdepth 3 -name "*.app" | head -20
          echo
          echo "===== extension Info.plist（若存在）====="
          for pl in $(find "$RUNNER_TEMP/DerivedDataDevice/Build/Products" -name "DayEchoWatchExtension.appex" -type d 2>/dev/null); do
            echo "--- $pl ---"
            /usr/libexec/PlistBuddy -c 'Print' "$pl/Info.plist" 2>&1 | head -40
          done

          echo
          echo "===== Watch App 自己的 Info.plist（关键）====="
          WAPP=$(find "$RUNNER_TEMP/DerivedDataDevice/Build/Products" -name "DayEchoWatch.app" -type d 2>/dev/null | head -1)
          if [ -n "$WAPP" ]; then
            echo "--- $WAPP ---"
            /usr/libexec/PlistBuddy -c 'Print' "$WAPP/Info.plist" 2>&1 | head -40
            echo "--- 关键键 ---"
            for k in CFBundleIdentifier WKCompanionAppBundleIdentifier WKWatchOnly WKAppBundleIdentifier CFBundlePackageType; do
              echo -n "$k = "
              /usr/libexec/PlistBuddy -c "Print :$k" "$WAPP/Info.plist" 2>/dev/null || echo "(缺)"
            done
          else
            echo "没找到 DayEchoWatch.app"
          fi

      # ---- 7. 真机归档 + 打出 unsigned .ipa ----
      - name: Archive for device and package unsigned .ipa
        run: |
          set -e
          xcodebuild \
            -project DayEcho.xcodeproj \
            -scheme DayEcho \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            -archivePath "$RUNNER_TEMP/DayEcho-device.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

          APP="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app"
          if [ ! -d "$APP" ]; then
            echo "::error::device archive 里没找到 DayEcho.app"; exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipapkg"
          mkdir -p "$RUNNER_TEMP/ipapkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipapkg/Payload/"
          cd "$RUNNER_TEMP/ipapkg"
          zip -qry "$RUNNER_TEMP/DayEcho-unsigned.ipa" Payload
          echo "--- .ipa 产出 ---"
          ls -la "$RUNNER_TEMP/DayEcho-unsigned.ipa"

      # ---- 8. 验证真机二进制架构 ----
      - name: Verify device binary is arm64
        run: |
          set -e
          BIN="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app/DayEcho"
          if [ ! -f "$BIN" ]; then
            echo "::error::找不到 device 二进制"; exit 1
          fi
          echo "--- lipo 架构 ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'arm64' || { echo "::error::不是 arm64"; exit 1; }
          if lipo -info "$BIN" | grep -qiE 'x86_64|i386-simulator'; then
            echo "::error::device 二进制混入了模拟器架构"; exit 1
          fi
          echo "✅ 真机 arm64 二进制确认"

      # ---- 9. 验证 watchOS App 已嵌入 iOS 包 ----
      # 这是最容易悄悄坏掉的地方：watch target 编过了，但没被
      # "Embed Watch Content" 阶段塞进 .app，装到手机上会没有手表 App。
      #
      # watchOS 的包结构是两层：
      #   DayEcho.app/PlugIns/DayEchoWatch.app          <- watch2_app 壳
      #   DayEcho.app/PlugIns/DayEchoWatch.app/PlugIns/DayEchoWatchExtension.appex  <- 业务代码
      # 只验到壳这一层不够 —— 扩展缺失的话手表上点开就白屏。
      - name: Verify watchOS app is embedded
        run: |
          set -e
          APP="$RUNNER_TEMP/DayEcho-device.xcarchive/Products/Applications/DayEcho.app"
          FOUND=$(find "$APP/PlugIns" -maxdepth 2 -name "DayEchoWatch.app" 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::iOS 包里没找到嵌入的 DayEchoWatch.app（PlugIns 为空）"; exit 1
          fi
          echo "--- 嵌入的 watch App: $FOUND ---"
          WBIN="$FOUND/DayEchoWatch"
          if [ ! -f "$WBIN" ]; then
            echo "::error::watch App 里没有可执行文件"; exit 1
          fi
          lipo -info "$WBIN"
          lipo -info "$WBIN" | grep -q 'arm64' || { echo "::error::watch 二进制不是 arm64"; exit 1; }

          # 关键：扩展必须存在
          APPEX=$(find "$FOUND/PlugIns" -maxdepth 2 -name "*.appex" 2>/dev/null | head -1)
          if [ -z "$APPEX" ]; then
            echo "::error::watch App 里没有 WatchKit Extension（.appex）——手表上会点不开"; exit 1
          fi

          # Extension 的 NSExtensionPointIdentifier 必须是 com.apple.watchkit，
          # 否则设备上会报 "WatchKit App doesn't contain any WatchKit Extensions"
          EPI=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" 2>/dev/null || echo "")
          if [ "$EPI" != "com.apple.watchkit" ]; then
            echo "::error::Extension 的 NSExtensionPointIdentifier 不对（当前='$EPI'，应为 com.apple.watchkit）"; exit 1
          fi
          echo "NSExtensionPointIdentifier = $EPI  ✓"

          # WKAppBundleIdentifier 必须等于 Watch App 的 CFBundleIdentifier
          WKC=$(/usr/libexec/PlistBuddy -c 'Print :WKAppBundleIdentifier' "$APPEX/Info.plist" 2>/dev/null || echo "")
          WAC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FOUND/Info.plist" 2>/dev/null || echo "")
          echo "WKAppBundleIdentifier = $WKC"
          echo "watch app CFBundleIdentifier = $WAC"
          if [ -z "$WKC" ] || [ "$WKC" != "$WAC" ]; then
            echo "::error::WKAppBundleIdentifier 与 watch app 的 CFBundleIdentifier 不一致"; exit 1
          fi

          # 依附式手表 App 不能声明 WKWatchOnly=true
          # （那表示独立手表 App，与嵌入 iOS App 冲突）
          WWO=$(/usr/libexec/PlistBuddy -c 'Print :WKWatchOnly' "$FOUND/Info.plist" 2>/dev/null || echo "")
          if [ "$WWO" = "true" ] || [ "$WWO" = "1" ]; then
            echo "::error::watch app 声明了 WKWatchOnly=true，与嵌入 iOS App 冲突"; exit 1
          fi
          echo "--- watch App 结构 ---"
          find "$FOUND" -maxdepth 3 -name "*.appex" -o -maxdepth 2 -name "Info.plist" | sed "s|$RUNNER_TEMP||" 
          echo "--- 嵌入的 Extension: $APPEX ---"
          EBIN="$APPEX/DayEchoWatchExtension"
          if [ ! -f "$EBIN" ]; then
            echo "::error::Extension 里没有可执行文件"; exit 1
          fi
          lipo -info "$EBIN"
          lipo -info "$EBIN" | grep -q 'arm64' || { echo "::error::Extension 二进制不是 arm64"; exit 1; }
          echo "✅ watchOS App 与 Extension 均已正确嵌入且为 arm64"

      # ---- 10. 收集产物 ----
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          for d in "$RUNNER_TEMP/DayEcho-device.xcarchive" "$RUNNER_TEMP/DerivedData/Build/Products" "$RUNNER_TEMP/DerivedDataWatch/Build/Products"; do
            [ -d "$d" ] && cp -R "$d" artifacts/ 2>/dev/null || true
          done
          [ -f "$RUNNER_TEMP/DayEcho-unsigned.ipa" ] && cp "$RUNNER_TEMP/DayEcho-unsigned.ipa" artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DayEcho-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
