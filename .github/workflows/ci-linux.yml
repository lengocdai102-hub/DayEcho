name: Kit Logic CI (Linux)

# ★ 为什么单独开一个 Linux 工作流 ★
#
# GitHub Actions 免费账户的额度结构：
#   - Linux  runner: 2000 分钟/月，**1 倍**计费
#   - macOS  runner:   50 分钟/月，**10 倍**计费（≈ 折合 200 分钟挂钟分）
#
# 本仓库 2026-11-13 实测：macOS 额度已撞穿（折合用掉 193 分钟），
# 后续 push 的 job **直接不启动**（报 "recent account payments have failed"，
# 实为额度耗尽，不是付款失败）。
#
# 而 DayEchoKit 的 145 个纯逻辑单测里，真正需要 macOS 的只有
# 「纯 Swift 实现 vs CryptoKit 的交叉校验」那 5 条 —— 其余 140 条
# （存储/传输/时间轴/候选/规则层/摘要）全是纯 Foundation，不依赖任何 Apple 框架。
#
# ⇒ 把纯逻辑测试搬到 Linux，1 倍计费、额度充足，改动当天就能得到反馈。
#   macOS 工作流保留，只负责 Xcode 工程构建（那部分离不开 macOS）。
#
# ★ 一致性保证 ★
# DayEchoKit 的 SHA-256 有两条实现路径（Apple=CryptoKit，Linux=纯 Swift），
# 两条必须逐字节一致，否则真机上传的校验和会和 Linux 算出的对不上。
# 这条不变量由 DigestTests 钉死：
#   - Linux 上跑 FIPS 180-4 官方向量（保证算法本身正确）
#   - macOS 上跑「纯 Swift == CryptoKit」直接对比（保证两条路径一致）
# 见 Sources/DayEchoTestCases/DigestTests.swift

on:
  push:
    branches: [main]
    paths:
      - 'Sources/DayEchoKit/**'
      - 'Sources/DayEchoTestCases/**'
      - 'Sources/DayEchoTestRunner/**'
      - 'Package.swift'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - 'Sources/DayEchoKit/**'
      - 'Sources/DayEchoTestCases/**'
      - 'Sources/DayEchoTestRunner/**'
      - 'Package.swift'
      - '.github/workflows/ci-linux.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # ★ Linux runner 起得快，排队浪费额度 ⇒ 可以取消 ★

jobs:
  kit-tests:
    name: DayEchoKit Tests (Linux)
    # ★ 固定 ubuntu-24.04，不使用 ubuntu-latest ★
    #
    # GitHub 公告：`ubuntu-latest` 将于 2026-10-19 起迁移到 Ubuntu 26.04。
    # 而 `swift-actions/setup-swift@v2` 目前**不支持 26.04**：
    #   Unexpected error, unable to continue.
    #   Version "26.04" of Ubuntu is not supported
    # ⇒ 跟着 latest 走 = CI 在某个早上突然全红，且错误信息指向 runner 而不是我们的代码。
    # ⇒ 显式钉 24.04（当前受支持且 Swift 工具链齐全）。
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          # ★ 必须 ≥ 6.0 ★
          #
          # Package.swift 第一行是 `swift-tools-version: 6.0`。
          # 用 5.9 的工具链构建会直接失败：
          #   error: package '...' is using Swift tools version 6.0.0 but the
          #   installed version is 5.9.0
          #
          # ★ 这里踩过一个坑 ★
          # 第一版写的是 5.9，Linux job 会在构建第一步就挂掉 ——
          # 而 macOS 本机是 Swift 6.1.2，所以本地永远测不出来。
          # 这正是「同一天拿到反馈」的意义：平台差异只有跨平台 runner 才暴露。
          swift-version: "6.0"

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # ★ 跑测试并断言数量 ★
      #
      # 一次运行同时做两件事：跑测试 + 校验结果。
      # 不拆成两步是因为跑两遍要双倍时间（额度），而这里额度紧张。
      - name: Run tests
        run: |
          set -uo pipefail
          # ★ 不要用 set -e ★
          #
          # `OUTPUT="$(swift run ...)"` 这一行如果程序非零退出，
          # set -e 会**在 echo 之前**就杀掉整个脚本 ⇒
          # 测试输出全丢，日志里只剩 "Process completed with exit code 1"，
          # 完全看不出是哪条用例挂了。
          # ⇒ 这里只保留 -u / -o pipefail，退出码靠下面的显式判断。
          set +e
          OUTPUT="$(swift run DayEchoTestRunner 2>&1)"
          TEST_EXIT=$?
          set -e
          echo "$OUTPUT"
          echo "---- 测试进程退出码: $TEST_EXIT ----"

          # ★ 防止「编译通过但没跑测试」的静默通过 ★
          # 若 runner 因为崩溃被杀，这里会因退出码非 0 直接失败；
          # 若测试一个都没跑，输出里不会有「通过 N / 失败 0」这一行 ⇒ 同样失败。
          if ! echo "$OUTPUT" | grep -qE '通过 [0-9]+ / 失败 0'; then
            echo "❌ 测试未全部通过，详见上方输出"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q '失败明细'; then
            echo "❌ 存在失败用例"
            exit 1
          fi
          echo "✅ 全部单测通过"

      # ★ 交叉校验：Linux 上的摘要必须与 CryptoKit 完全一致 ★
      #
      # DigestTests 在 Linux 上会跑 FIPS 180-4 官方向量。
      # 这里额外跑一次「纯 Swift vs CryptoKit」是不可能的（Linux 没有 CryptoKit），
      # 所以一致性由 macOS 工作流负责 —— 但**官方向量这一层必须在 Linux 上也过**，
      # 否则 Linux 路径的算法一旦坏掉，没人会发现。
